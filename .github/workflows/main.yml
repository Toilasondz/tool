name: Build Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    name: Build HVSonTool.dylib (arm64 + arm64e)
    runs-on: macos-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Cài ldid (bắt buộc để sign dylib)
      # ─────────────────────────────────────────────
      - name: Install ldid
        run: |
          brew install ldid 2>/dev/null || true
          which ldid
          ldid -h | head -1

      # ─────────────────────────────────────────────
      # 3. Debug — check Xcode + SDK
      # ─────────────────────────────────────────────
      - name: Check Xcode SDK
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      # ─────────────────────────────────────────────
      # 4. Build dylib fat binary (arm64 + arm64e)
      # ─────────────────────────────────────────────
      - name: Build dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build

          # ---- Compile từng file cho từng arch ----
          for ARCH in arm64 arm64e; do
            echo "=== Compiling $ARCH ==="
            clang -c \
              -fobjc-arc -O2 \
              -arch $ARCH \
              -mios-version-min=14.0 \
              -isysroot "$SDK" \
              -I./Sources \
              -Wno-deprecated-declarations \
              Sources/HVSonMenu.m   -o build/HVSonMenu-$ARCH.o
            clang -c \
              -fobjc-arc -O2 \
              -arch $ARCH \
              -mios-version-min=14.0 \
              -isysroot "$SDK" \
              -I./Sources \
              -Wno-deprecated-declarations \
              Sources/HVSonEngine.m -o build/HVSonEngine-$ARCH.o
            clang -c \
              -fobjc-arc -O2 \
              -arch $ARCH \
              -mios-version-min=14.0 \
              -isysroot "$SDK" \
              -I./Sources \
              -Wno-deprecated-declarations \
              Sources/HVSonTweak.m  -o build/HVSonTweak-$ARCH.o
          done

          # ---- Link từng arch ----
          for ARCH in arm64 arm64e; do
            echo "=== Linking $ARCH ==="
            clang -dynamiclib \
              -fobjc-arc -O2 \
              -arch $ARCH \
              -mios-version-min=14.0 \
              -isysroot "$SDK" \
              -framework UIKit \
              -framework Foundation \
              -framework AVFoundation \
              -framework CoreImage \
              -install_name "@executable_path/HVSonTool.dylib" \
              -compatibility_version 1.0 \
              -current_version 1.0 \
              build/HVSonMenu-$ARCH.o \
              build/HVSonEngine-$ARCH.o \
              build/HVSonTweak-$ARCH.o \
              -o build/HVSonTool-$ARCH.dylib
          done

          # ---- Gộp thành fat binary ----
          echo "=== Creating fat binary ==="
          lipo -create \
            build/HVSonTool-arm64.dylib \
            build/HVSonTool-arm64e.dylib \
            -output build/HVSonTool.dylib

          # ---- Sign bằng ldid (ad-hoc) ----
          echo "=== Signing ==="
          ldid -S build/HVSonTool.dylib

          # ---- Verify ----
          echo "=== Verify ==="
          lipo -info build/HVSonTool.dylib
          file build/HVSonTool.dylib
          otool -L build/HVSonTool.dylib | head -10

      # ─────────────────────────────────────────────
      # 5. Đóng gói kèm plist (tiện cho TrollFools)
      # ─────────────────────────────────────────────
      - name: Package with plist
        run: |
          set -e
          mkdir -p out
          cp build/HVSonTool.dylib out/
          # Filter plist để tool inject biết bundle ID
          if [ -f HVSonTool.plist ]; then
            cp HVSonTool.plist out/HVSonTool.plist
          fi
          # README hướng dẫn
          cat > out/README.txt <<'EOF'
          HVSonTool.dylib - H Van Son
          =================================
          Đã sign ldid -S (ad-hoc).
          Deployment target: iOS 14.0
          Arch: arm64 + arm64e

          CÁCH DÙNG:
          1) TrollStore + TrollFools:
             - Copy HVSonTool.dylib + HVSonTool.plist vào iPhone
             - Mở TrollFools > chọn Video Star > Add dylib > chọn file
             - Kill app > mở lại

          2) Sideloadly/Azule (inject vào IPA):
             - Mở IPA Video Star bằng Sideloadly
             - Add dylib: chọn HVSonTool.dylib
             - Sign + cài đặt

          3) Jailbreak (copy tay):
             - cp HVSonTool.dylib /Applications/VideoStar.app/
             - cp HVSonTool.plist /Library/MobileSubstrate/DynamicLibraries/
             - chmod 755 HVSonTool.dylib
             - killall -9 "Video Star"
          EOF
          ls -la out/

      # ─────────────────────────────────────────────
      # 6. Upload artifact
      # ─────────────────────────────────────────────
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HVSonTool-dylib
          path: out/
          if-no-files-found: error

      # ─────────────────────────────────────────────
      # 7. Release khi push tag v*
      # ─────────────────────────────────────────────
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/HVSonTool.dylib
            out/HVSonTool.plist
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
