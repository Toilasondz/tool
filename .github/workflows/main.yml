name: Build HVSonTool

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build tweak (rootful + rootless)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── Setup Theos (dùng bản có sẵn nếu có) ───
      - name: Setup Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          if [ ! -x "$THEOS/bin/theos" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          else
            echo "Theos already pre-installed on runner"
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      # ─── Setup SDKs (xoá cũ rồi clone lại) ───
      - name: Install iOS SDKs
        run: |
          set -e
          export THEOS="$HOME/theos"
          SDK_DIR="$THEOS/sdks"
          rm -rf "$SDK_DIR"
          git clone --depth=1 https://github.com/theos/sdks.git "$SDK_DIR"
          ls -1 "$SDK_DIR" | grep iPhoneOS || true

      # ─── Công cụ build ───
      - name: Install build tools
        run: |
          brew install ldid dpkg 2>/dev/null || brew install ldid

      # ─── Build rootful ───
      - name: Build rootful package
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1
          mkdir -p artifacts/rootful
          cp -v packages/*.deb artifacts/rootful/ 2>/dev/null || true

      # ─── Build rootless ───
      - name: Build rootless package
        run: |
          set -e
          make clean || true
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS="arm64 arm64e"
          mkdir -p artifacts/rootless
          cp -v packages/*.deb artifacts/rootless/ 2>/dev/null || true

      # ─── Upload artifacts ───
      - name: Upload rootful .deb
        uses: actions/upload-artifact@v4
        with:
          name: HVSonTool-rootful
          path: artifacts/rootful/*.deb
          if-no-files-found: error

      - name: Upload rootless .deb
        uses: actions/upload-artifact@v4
        with:
          name: HVSonTool-rootless
          path: artifacts/rootless/*.deb
          if-no-files-found: error

      # ─── Release khi push tag ───
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
